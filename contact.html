
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("timee.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }

        .contact {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px 130px;
        }

        .content {
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .content h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .content p {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 15px;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.85);
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
        }

        .contact-form textarea {
            min-height: 130px;
            resize: vertical;
        }

        .contact-form button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #00d9ff;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-form button:hover {
            background: white;
            transform: translateY(-2px);
        }

        .contact-info {
            margin-top: 25px;
            font-size: 14px;
            line-height: 2;
        }

        .contact-info a {
            color: #00e5ff;
            text-decoration: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 850px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .bottom-nav a {
            text-decoration: none;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .bottom-nav a:hover,
        .bottom-nav a.active {
            background: #00d9ff;
            color: black;
        }

        @media (max-width: 600px) {
            .contact {
                padding: 25px 12px 140px;
            }

            .content {
                padding: 30px 20px;
            }

            .content h1 {
                font-size: 32px;
            }

            .content p {
                font-size: 14px;
            }

            .bottom-nav {
                bottom: 10px;
                width: 96%;
                padding: 8px 5px;
                gap: 3px;
                border-radius: 18px;
            }

            .bottom-nav a {
                padding: 10px 7px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <section class="contact">
        <div class="content">

            <h1>Contact Us</h1>

            <p>
                Have a question or suggestion?
                We would love to hear from you.
                Fill out the form below to get in touch with us.
            </p>

            <form class="contact-form" id="contactForm">

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Your Email Address"
                    required
                >

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Subject"
                    required
                >

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

                <button type="submit">Send Message</button>

            </form>

            <div class="contact-info">
                <p>?? Email: yourname@example.com</p>
                <p>?? Location: Your City, Philippines</p>
            </div>

        </div>
    </section>

    <nav class="bottom-nav">
        <a href="homepage.html">HOMEPAGE</a>
        <a href="about.html">ABOUT</a>
        <a href="product.html">PRODUCT</a>
        <a href="contact.html" class="active">CONTACT</a>
        <a href="filmviewing.html">FILM VIEWING</a>
        <a href="index.html" class="logout">LOGOUT</a>
       
    </nav>

    <script>
        document.getElementById("contactForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();

                alert(
                    "Thank you, " + name + "!\n\n" +
                    "Your message has been prepared successfully."
                );

                this.reset();
            }
        );
    </script>

</body>
</html>
